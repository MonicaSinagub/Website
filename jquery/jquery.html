<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="jquery.css">
</head>
<body>

    <div class="gallery-container">
        <h2>My Photo Gallery</h2>
        <p><a href="index.html">Home</a></p>

        <!-- Carousel Wrapper -->
        <div class="carousel">
            <!-- Images and Captions -->
            <div class="carousel-slide fade">
                <img src="download (1).gif" alt="Demon Slayer GIF">
                <div class="carousel-caption">pretty eyes.</div>
            </div>

            <div class="carousel-slide fade">
                <img src="download (3).gif" alt="Demon Slayer GIF">
                <div class="carousel-caption">Demon Slayer .</div>
            </div>

            <div class="carousel-slide fade">
                <img src="download (2).gif" alt="Third Image">
                <div class="carousel-caption">awesome</div>
            </div>

            <div class="carousel-slide fade">
                <img src="yea.gif" alt="Fourth Image">
                <div class="carousel-caption">cutiee.</div>
            </div>

            
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>

        
        <div class="dots-container" style="text-align:center">
            <span class="dot" onclick="currentSlide(1)"></span> 
            <span class="dot" onclick="currentSlide(2)"></span> 
            <span class="dot" onclick="currentSlide(3)"></span> 
            <span class="dot" onclick="currentSlide(4)"></span> 
        </div>
    </div>

    <script src="jquery.js"></script>
</body>
</html>
