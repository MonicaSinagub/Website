
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <link rel="stylesheet" href="cssFiles/style.css">
</head>
<body>
    <center>
        <div style="border: 2px solid rgb(211, 11, 38); padding: 0; width: 500px;">
            
            <!-- Violet Header -->
            <h2 style="background: rgb(238, 26, 26); color: white; margin: 0; padding: 10px;">
                Portal Login
            </h2>
            
            <!-- Content with SPACE on sides -->
            <div style="padding: 20px 25px;">
                <table style="width: 100%;">
                    <tr>
                        <td style="text-align: left; padding-bottom: 5px;">Username:</td>
                    </tr>
                    <tr>
                        <td>
                            <input type="text" placeholder="Enter Email..." maxlength="50" 
                                   style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left; padding: 15px 0 5px;">Password:</td>
                    </tr>
                    <tr>
                        <td>
                            <input type="password" placeholder="Enter Password" required 
                                   style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </td>
                    </tr>
                </table>

                <p style="margin-top: 20px;">
                    <button type="submit" style="padding: 8px 22px; margin: 0 5px;">Submit</button>
                    <button type="reset" style="padding: 8px 22px; margin: 0 5px;">Reset</button>
                </p>

                <p style="margin-top: 20px; font-size: 14px;">Created by: Monica P. Sinagub  - 12 Cooper</p>
            </div>
        </div>
    </center>
</body>
</html>
