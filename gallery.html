<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brian Bactol - Gallery</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #fff0f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* NAVBAR */
nav {
    background-color: #f11094;
    display: flex;
    justify-content: flex-start;
    padding: 0 20px;
}

nav ul {
    list-style: none;
    display: flex;
}

nav ul li a {
    display: block;
    color: #ffffff;
    text-decoration: none;
    padding: 14px 20px;
    font-size: 16px;
    font-family: 'Times New Roman', Times, serif;
}

nav ul li a:hover, 
nav ul li a.active {
    background-color: #f13fda;
    border-bottom: 3px solid #ffcc00;
}

/* GALLERY */
.container {
    flex: 1;
    padding: 50px 20px;
    text-align: center;
}

h1 {
    font-size: 48px;
    color: #c2185b;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

/* SLIDESHOW */
.slideshow-container {
    max-width: 800px;
    height: 450px;
    position: relative;
    margin: 0 auto;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(241, 16, 148, 0.3);
}

.slide {
    display: none;
    width: 100%;
    height: 100%;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ARROWS - MAS MALAKI NA */
.prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    padding: 20px 18px;
    color: white;
    font-weight: bold;
    font-size: 32px;
    transition: 0.3s;
    background: rgba(241, 16, 148, 0.8);
    border-radius: 8px;
    user-select: none;
    z-index: 5;
}

.prev { left: 15px; }
.next { right: 15px; }

.prev:hover, .next:hover {
    background: #f11094;
    transform: translateY(-50%) scale(1.1);
}

/* CAPTION */
.caption {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: rgba(241, 16, 148, 0.85);
    color: white;
    padding: 15px;
    font-size: 18px;
}

/* DOTS */
.dots-container {
    text-align: center;
    padding: 20px;
}

.dot {
    cursor: pointer;
    height: 14px;
    width: 14px;
    margin: 0 6px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
    transition: 0.3s;
}

.active-dot, .dot:hover {
    background-color: #f11094;
}

.fade {
    animation: fade 0.6s;
}

@keyframes fade {
    from {opacity: .4} 
    to {opacity: 1}
}

/* FOOTER */
footer {
    background: linear-gradient(to bottom, #ec407a, #f11094);
    padding: 15px 10px;
    color: white;
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 500px) {
    .slideshow-container { height: 200px; }
    h1 { font-size: 32px; }
    nav ul { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- MAIN -->
    <div class="container">
        <h1>My Photo Gallery</h1>
        

        <!-- SLIDESHOW -->
        <div class="slideshow-container">
            
            <div class="slide fade">
                <img src="2cbc71d4-8cb3-4bcc-93c9-68cf89acf788.jpg" alt="Photo 1">
                <div class="caption">HAPPY MOMENTS</div>
            </div>

            <div class="slide fade">
                <img src="8b62fd73-95b3-475f-8817-70848f041eed.jpg" alt="Photo 2">
                <div class="caption">HAPPY MOMENTS</div>
            </div>

            <div class="slide fade">
                <img src="47a4da7c-16db-4815-8880-0aad42e31ac3.jpg" alt="Photo 3">
                <div class="caption">TAGAYTAY PEOPLES PARK</div>
            </div>

            <div class="slide fade">
                <img src="707817d7-18b5-49ee-a230-b4f4dabbfc88.jpg" alt="Photo 4">
                <div class="caption">HAPPY MOMENTS</div>
            </div>

            <!-- ARROWS -->
            <a class="prev" onclick="plusSlides(-1)">❮</a>
            <a class="next" onclick="plusSlides(1)">❯</a>
        </div>

        <!-- DOTS -->
        <div class="dots-container">
            <span class="dot" onclick="currentSlide(1)"></span> 
            <span class="dot" onclick="currentSlide(2)"></span> 
            <span class="dot" onclick="currentSlide(3)"></span> 
            <span class="dot" onclick="currentSlide(4)"></span> 
        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        2026 TechCooper Solutions | Teacher: Ma'am Jovy
    </footer>

<script>
let slideIndex = 1;
showSlides(slideIndex);

// Next/prev controls
function plusSlides(n) {
    showSlides(slideIndex += n);
}

// Dot controls
function currentSlide(n) {
    showSlides(slideIndex = n);
}

function showSlides(n) {
    let i;
    let slides = document.getElementsByClassName("slide");
    let dots = document.getElementsByClassName("dot");
    if (n > slides.length) {slideIndex = 1}    
    if (n < 1) {slideIndex = slides.length}
    for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
    }
    for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active-dot", "");
    }
    slides[slideIndex-1].style.display = "block";  
    dots[slideIndex-1].className += " active-dot";
}

// WALA NANG AUTO SLIDE DITO
</script>

</body>
</html>
