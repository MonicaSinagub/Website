<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brian Bactol - About</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(135deg, #ffe4f0 0%, #ffc1e3 50%, #ff9ecf 100%);
    color: #333;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* NAVBAR */
nav {
    background: rgba(241, 16, 148, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: flex-start;
    padding: 0 20px;
}

nav ul { list-style: none; display: flex; }
nav ul li a {
    display: block;
    color: #ffffff;
    text-decoration: none;
    padding: 16px 22px;
    font-size: 16px;
}
nav ul li a.active {
    background: rgba(241, 63, 218, 0.5);
    border-bottom: 3px solid #ffcc00;
}

/* CONTENT */
.container {
    flex: 1;
    padding: 20px 20px 50px; /* PINALITAN: 30px to 20px para mas tumaas */
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
}

/* PROFILE CARD - MAS INANGAT */
.profile-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(241, 16, 148, 0.3);
    margin-bottom: 30px; /* PINALITAN: 40px to 30px */
    margin-top: -20px; /* PINALITAN: -10px to -20px para mas tumaas */
}

.profile-pic {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 5px solid #f11094;
    object-fit: cover;
    margin-bottom: 15px;
}

/* CIRCLES - INANGAT DIN */
.circle-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: -10px; /* DAGDAG: para umangat yung bilog */
}

.circle-btn {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6ec7, #f11094);
    color: white;
    border: 2px solid rgba(255,255,255,0.4);
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5px;
    transition: all 0.4s;
    box-shadow: 0 0 15px rgba(241, 16, 148, 0.4);
}

.circle-btn:hover {
    transform: scale(1.15) rotate(8deg);
    box-shadow: 0 0 30px rgba(241, 16, 148, 0.8);
}

/* POPUP MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s;
}

.modal.show { display: flex; }

.modal-content {
    width: 90%;
    max-width: 600px;
    border-radius: 25px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(241, 16, 148, 0.5);
    animation: popUp 0.4s;
}

.modal-content.goals {
    background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                url('https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=800') center/cover;
}
.modal-content.achievements {
    background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800') center/cover;
}
.modal-content.artists {
    background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                url('https://images.unsplash.com/photo-1578632294555-df7129c8ae28?w=800') center/cover;
}
.modal-content.shows {
    background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                url('https://images.unsplash.com/photo-1618331835958-6aa0b3af0c48?w=800') center/cover;
}
.modal-content.games {
    background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800') center/cover;
}

.back-btn {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(241, 16, 148, 0.9);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
}

.back-btn:hover { transform: scale(1.1); background: #d81b60; }

.modal-body {
    padding: 50px 30px 30px;
    text-align: center;
}

.modal-body h3 {
    color: #c2185b;
    font-size: 32px;
    margin-bottom: 20px;
}

.modal-body p {
    line-height: 2;
    color: #333;
    font-size: 18px;
    white-space: pre-line;
    font-weight: 500;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popUp { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* FOOTER */
footer {
    background: linear-gradient(135deg, #ec407a, #f11094);
    padding: 30px 20px;
    color: white;
    text-align: center;
    font-weight: bold;
    margin-top: auto;
}

@media (max-width: 768px) {
    .circle-btn { width: 80px; height: 80px; font-size: 10px; }
}
</style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html" class="active">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="profile-card">
            <img src="2db32ab6-fb51-4427-87a3-b63940d2ae99.jpg" alt="My Photo" class="profile-pic">
            <h2>Monica Rose Sinagub</h2>
            <p>ICT - Computer Programming | Grade 12</p>
            <p>I am a student who loves exploring programming and web development!</p>
        </div>

        <div class="circle-container">
            <button class="circle-btn" onclick="openModal('goals')">Goals</button>
            <button class="circle-btn" onclick="openModal('achievements')">Achievements</button>
            <button class="circle-btn" onclick="openModal('artists')">Artists</button>
            <button class="circle-btn" onclick="openModal('shows')">Shows</button>
            <button class="circle-btn" onclick="openModal('games')">Games</button>
        </div>

    </div>

    <!-- POPUP MODAL -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div id="modalContent" class="modal-content" onclick="event.stopPropagation()">
            <button class="back-btn" onclick="closeModal()">←</button>
            <div class="modal-body">
                <h3 id="modalTitle"></h3>
                <p id="modalText"></p>
            </div>
        </div>
    </div>

    <footer>
        2026 TechCooper Solutions | Teacher: Ma'am Jovy
    </footer>

<script>
const contents = {
    goals: {
        title: "My Goals",
        text: "My goal is to finish college and become a successful web developer.\nI also dream of creating my own website and apps that can help people.\nAnd to keep learning and improving my skills everyday!"
    },
    achievements: {
        title: "Achievements",
        text: "• Completed my first website project\n• Learned HTML, CSS, and JavaScript"
    },
    artists: {
        title: "Favorite Artists",
        text: "• SB19\n• Ben&Ben\n• Taylor Swift\n• Local Indie Artists"
    },
    shows: {
        title: "Favorite Shows & Movies",
        text: "• Anime: One Piece, Naruto\n• Movies: Marvel, Spider-Man\n• Series: Stranger Things\n• Cartoons: Adventure Time"
    },
    games: {
        title: "My Favorite Games",
        text: "• Mobile Legends\n• Valorant\n• Minecraft\n• Genshin Impact"
    }
};

function openModal(key) {
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    const title = document.getElementById('modalTitle');
    const text = document.getElementById('modalText');
    
    title.innerText = contents[key].title;
    text.innerText = contents[key].text;
    
    modalContent.className = 'modal-content ' + key;
    modal.classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
}

document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
});
</script>

</body>
</html>
